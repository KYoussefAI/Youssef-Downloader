name: ISSA v3 Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [feature/issa-v3-2-format-fix]
concurrency:
  group: issa-v3-2-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Generate ISSA branded icon
        run: python tools/generate_brand.py
      - name: Python syntax check
        run: python -m compileall -q main.py gui_v3.py downloader.py progress_tracking.py config.py utils.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Native GUI click test (MP4 → MP3 → Télécharger)
        run: python tools/ui_smoke_windows.py
      - name: Build standalone executable with bundled FFmpeg
        run: python -m PyInstaller --noconfirm --clean ISSA-onefile.spec
      - name: Verify produced exe
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ISSA.exe')) { throw 'Missing ISSA.exe' }
          $size = (Get-Item 'dist/ISSA.exe').Length
          if ($size -lt 80000000) { throw "Unexpectedly small self-contained executable: $size" }
          Write-Host "ISSA.exe built: $size bytes"
      - name: Smoke test packaged FFmpeg, Deno and yt-dlp
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/ISSA.exe').Path -ArgumentList '--self-test' -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'ISSA Downloader/logs/app.log'
          if (Test-Path $log) { Get-Content $log -Tail 20 }
          if ($p.ExitCode -ne 0) { throw "Packaged runtime smoke test failed ($($p.ExitCode))" }
      - name: Upload single-file Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ISSA-v3-2-FR-EXE
          path: dist/ISSA.exe
          compression-level: 6
          if-no-files-found: error
