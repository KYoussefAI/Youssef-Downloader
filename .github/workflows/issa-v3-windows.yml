name: ISSA v3 Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [feature/issa-v3-french-ui]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Generate ISSA branded icon
        run: python tools/generate_brand.py
      - name: Python syntax check
        run: python -m compileall -q main.py gui_v3.py downloader.py config.py utils.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable with bundled FFmpeg
        run: python -m PyInstaller --noconfirm --clean ISSA-onefile.spec
      - name: Verify produced exe
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ISSA.exe')) { throw 'Missing ISSA.exe' }
          $size = (Get-Item 'dist/ISSA.exe').Length
          if ($size -lt 200000000) { throw "Unexpectedly small self-contained executable: $size" }
          Write-Host "ISSA.exe built: $size bytes"
      - name: Upload single-file Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ISSA-v3-FR-EXE
          path: dist/ISSA.exe
          compression-level: 6
          if-no-files-found: error
